name: Orion PIO Weekly Radar

on:
  workflow_dispatch:
  schedule:
    # 08:00 Puerto Rico / AST (UTC-4) every Friday, year-round.
    - cron: "0 12 * * 5"

permissions:
  contents: read

# Avoid overlapping refreshes while allowing an active run to finish safely.
concurrency:
  group: orion-weekly-radar
  cancel-in-progress: false

jobs:
  weekly-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly research agent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
        run: python weekly_agent.py

      - name: Upload weekly radar report
        uses: actions/upload-artifact@v4
        with:
          name: orion-weekly-radar-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/weekly_*.md
          if-no-files-found: error
          retention-days: 30

name: Orion PIO Weekly Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-radar.yml"
  schedule:
    # Fridays at 08:00 Puerto Rico (AST, UTC-4)
    - cron: "0 12 * * 5"

permissions:
  contents: write

jobs:
  weekly-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly research agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
        run: python weekly_agent.py

      - name: Commit refreshed research database and report
        run: |
          git config user.name "orion-pio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pio_dashboard.db reports/ || true
          if git diff --cached --quiet; then
            echo "No research changes to commit."
          else
            git commit -m "chore: weekly PIO radar refresh"
            git push
          fi
name: Orion Daily Radar

on:
  workflow_dispatch:
  schedule:
    # 07:00 Puerto Rico / AST (UTC-4) year-round
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: orion-daily-radar
  cancel-in-progress: false

jobs:
  daily-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Orion daily refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          # Reserve 35 of the job's 50 minutes for all 251 taxonomy queries.
          ORION_LIVE_SWEEP_RUNTIME_SECONDS: "2100"
        run: python daily_agent.py
      - name: Upload daily radar reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orion-daily-radar-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/daily_*.json
            reports/daily_*.md
          if-no-files-found: error
          retention-days: 30

name: Orion Daily Radar

on:
  workflow_dispatch:
  schedule:
    # 07:00 Puerto Rico / AST (UTC-4) year-round
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: orion-daily-radar
  cancel-in-progress: false

jobs:
  daily-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Orion daily refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
        run: python daily_agent.py
      - name: Upload daily radar reports
        uses: actions/upload-artifact@v4
        with:
          name: orion-daily-radar-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/daily_*.json
            reports/daily_*.md
          if-no-files-found: error
          retention-days: 30

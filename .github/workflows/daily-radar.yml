name: Orion Daily Radar

on:
  workflow_dispatch:
  schedule:
    # 06:00 Puerto Rico / AST (UTC-4) year-round.
    # GitHub Actions schedules use UTC; Puerto Rico remains UTC-4 year-round.
    - cron: "0 10 * * *"

permissions:
  contents: read

# Only one refresh may write checkpoints and reports at a time. If a manual
# run overlaps the scheduled run, it waits instead of duplicating harvest work.
concurrency:
  group: orion-daily-radar
  cancel-in-progress: false

jobs:
  daily-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Orion daily refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          # Live taxonomy gets the protected runtime budget and persists each query.
          ORION_LIVE_SWEEP_RUNTIME_SECONDS: "2100"
          # Historical work advances one month per run and resumes by checkpoint.
          # This prevents backfill from consuming the report-generation window.
          ORION_BACKFILL_TARGET_MONTHS_PER_RUN: "1"
          ORION_BACKFILL_MONTHS_PER_RUN: "1"
          # Geographic discovery remains bounded and independently rotated.
          ORION_GEO_RUNTIME_SECONDS: "180"
        run: python daily_agent.py
      - name: Upload daily radar reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orion-daily-radar-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/daily_*.json
            reports/daily_*.md
          if-no-files-found: warn
          retention-days: 30

name: Orion v3 CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Test suite and coverage
        run: >-
          PYTHONPATH=. python -m pytest -m "not network and not postgres" -q
          --cov=database
          --cov=research_agent --cov=data_store --cov=platform_store
          --cov=orion_platform --cov=export_utils --cov=orion_api
          --cov=scripts.orion_health_check
          --cov-report=term-missing --cov-fail-under=90

name: Orion System Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: orion-system-health-monitor
  cancel-in-progress: false

jobs:
  health-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install monitor dependencies
        run: pip install "requests>=2.32" "psycopg[binary]>=3.2"

      - name: Check Orion system health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: PYTHONPATH=. python scripts/orion_health_check.py --output artifacts/orion-health.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orion-system-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/orion-health.json
          if-no-files-found: error
          retention-days: 30
